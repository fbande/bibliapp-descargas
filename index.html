<!doctype html>
<html lang="es"><head><meta charset="utf-8">

<style>
:root{--m:#6d4c41;--a:#b69b7e;--bg:#f6f1eb;--tx:#474747}
*{box-sizing:border-box}body{margin:0;font-family:Roboto,"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--tx)}
.wrap{max-width:460px;margin:0 auto;padding:28px 20px 40px;text-align:center}
.wide .wrap{max-width:860px;display:grid;grid-template-columns:1fr 1fr;gap:40px;text-align:left;align-items:center;padding-top:70px}
.icon{width:104px;height:104px;border-radius:24px;box-shadow:0 6px 18px rgba(0,0,0,.18)}
h1{font-size:30px;font-weight:500;margin:18px 0 6px;color:var(--m)}
.sub{font-size:17px;margin:0 0 22px;color:#6b6b6b}
.btn{display:block;width:100%;padding:16px;border:0;border-radius:28px;background:var(--m);color:#fff;font-size:18px;font-weight:500;text-decoration:none}
.btn small{display:block;font-size:13px;font-weight:400;opacity:.85;margin-top:2px}
.pasos{text-align:left;background:#fff;border-radius:16px;padding:16px 18px;margin:20px 0 0;font-size:15px;line-height:1.5}
.pasos b{color:var(--m);font-weight:500}.pasos ol{margin:8px 0 0;padding-left:20px}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:0 0 20px}
.chip{background:#ece3d8;border-radius:16px;padding:6px 12px;font-size:13px;color:var(--m)}
.pie{margin-top:22px;font-size:13px;color:#8a8a8a}.pie code{font-size:11px;word-break:break-all}
.qr{background:#fff;border-radius:20px;padding:22px;text-align:center;box-shadow:0 6px 18px rgba(0,0,0,.08)}
.qr img{width:240px;height:240px}.qr p{margin:10px 0 0;font-size:15px;color:var(--m)}
.wide .chips{justify-content:flex-start}.expl{font-size:17px;line-height:1.5;margin:6px 0 14px}.expl b{color:var(--m);font-weight:500}
.cafe{display:inline-block;margin-top:16px;padding:12px 20px;border:1.5px solid var(--a);border-radius:24px;background:#fff;color:var(--m);font-size:16px;font-weight:500;text-decoration:none}.cafe small{display:block;font-size:12px;font-weight:400;color:#8a8a8a;margin-top:2px}.lnk{color:var(--m);text-decoration:underline}.oculto{display:none}
</style></head><body>
<div id="app"></div>

else if(esIOS){h='<div class="wrap">'+headWeb+'<a class="btn" href="app/">Abrir BibliApp<small>Versión web</small></a><div class="pasos"><b>Para tenerla a mano en el celu</b><ol><li>Abrí esta página en <b>Safari</b>.</li><li>Tocá el botón <b>Compartir</b> (el cuadrado con la flecha).</li><li>Elegí <b>Agregar a pantalla de inicio</b>.</li></ol></div>'+pie+'</div>';}
else{document.body.className='wide';h='<div class="wrap"><div>'+head+'<p class="expl"><b>Escaneá el código con la cámara del celu.</b><br>En Android se descarga la app. En iPhone se abre la versión web.</p><p class="pie"><a class="lnk" href="app/">¿Querés verla acá? Abrir la versión web</a></p><a class="cafe" href="https://cafecito.app/bibliapp" target="_blank" rel="noopener">☕ Invitame un cafecito<small>Si la app te sirve. Es opcional.</small></a>'+pie+'</div><div class="qr"><img src="qr-pez.svg" alt="Código QR para descargar BibliApp"><p>Apuntá la cámara del celu acá</p></div></div>';}
document.getElementById('app').innerHTML=h;
</script>
<noscript><p style="text-align:center;padding:2rem">Descargá BibliApp para Android: <a href="https://github.com/fbande/bibliapp-descargas/releases/latest/download/BibliApp.apk">BibliApp.apk</a> · Versión web: <a href="app/">abrir</a></p></noscript>
</body></html>
